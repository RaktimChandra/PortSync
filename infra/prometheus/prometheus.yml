global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: portsync-core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["portsync-core:8080"]

  - job_name: simulator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["simulator:8081"]
