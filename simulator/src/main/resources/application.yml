server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: portsync-simulator
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        linger.ms: 5
    admin:
      fail-fast: false

simulator:
  speed-factor: ${SIM_SPEED_FACTOR:60}
  seed: ${SIM_SEED:42}
  auto-start: ${SIM_AUTO_START:true}
  seed-initial-yard: true
  initial-fill:
    A: 0.55
    B: 0.50
    C: 0.50
    D: 0.78
  vessel-interarrival: 100m
  pilotage-delay: 20m
  min-discharge: 20
  max-discharge: 40
  min-load: 15
  max-load: 30
  crane-moves-per-hour: 26
  trucks-per-hour: 30
  pickup-share: 0.6
  slow-truck-probability: 0.08
  crane-faults-per-hour: 0.15
  heartbeat-interval: 5m

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
