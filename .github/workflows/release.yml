# Publishes a GitHub release from main: tag v<version>, notes from CHANGELOG.md, and assets
# built from that commit after the full test suite passes on it - the three runnable jars and
# the built dashboard.
#
# Actions -> release -> Run workflow, version e.g. 1.1.0 (must match the Maven version and have
# a "## [version]" section in CHANGELOG.md).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Only from main, only once, only with matching version and notes
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::release from main only (got $GITHUB_REF)"; exit 1; }
          ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || { echo "::error::tag v$VERSION exists"; exit 1; }
          declared=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          [ "$declared" = "$VERSION" ] || { echo "::error::Maven version is $declared, not $VERSION"; exit 1; }
          [ "$(node -p "require('./frontend/package.json').version")" = "$VERSION" ] || { echo "::error::frontend/package.json version differs"; exit 1; }
          python3 - <<'PY'
          import os, re, sys
          v = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(v) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if not m:
              sys.exit(f"::error::no '## [{v}]' section in CHANGELOG.md")
          open("release-notes.md", "w", encoding="utf-8").write(m.group(1).strip() + "\n")
          PY
      - name: Backend - unit and integration tests, jars
        run: ./mvnw -B -ntp verify
      - name: Dashboard - typecheck, tests, build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Assets
        run: |
          mkdir dist
          cp portsync-core/target/portsync-core.jar "dist/portsync-core-$VERSION.jar"
          cp simulator/target/simulator.jar "dist/portsync-simulator-$VERSION.jar"
          cp loadtest/target/loadtest.jar "dist/portsync-loadtest-$VERSION.jar"
          (cd frontend/dist && zip -qr "../../dist/portsync-dashboard-$VERSION.zip" .)
          ls -l dist
      - name: Tag and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "PortSync $VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" dist/* --title "PortSync $VERSION" --notes-file release-notes.md --verify-tag
          echo "Released v$VERSION: $(gh release view "v$VERSION" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
