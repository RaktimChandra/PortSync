name: Load test

# Manual: Actions tab -> Load test -> Run workflow. Measures throughput and latency on a
# GitHub-hosted runner and attaches the report. Numbers depend on the machine; see RESULTS.md.
on:
  workflow_dispatch:
    inputs:
      events:
        description: Number of events to push
        default: '20000'

permissions:
  contents: read

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Start stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 240); do curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null && break; sleep 1; done
          sleep 30
      - name: Run load test
        run: scripts/run-loadtest.sh ${{ github.event.inputs.events }}
      - name: Machine
        run: |
          nproc; free -h; lscpu | grep 'Model name'
      - name: Report
        run: cat loadtest-results/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: loadtest-results
          path: loadtest-results/
      - if: always()
        run: docker compose down -v
