name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests (Surefire) + Testcontainers integration tests with real Kafka and PostgreSQL (Failsafe).
      - name: Build and test
        run: |
          set -o pipefail
          ./mvnw -B -ntp verify 2>&1 | tee "$RUNNER_TEMP/mvn.log"
      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py backend
      - name: Build errors
        if: failure()
        run: |
          grep -E "^\[ERROR\]" "$RUNNER_TEMP/mvn.log" | grep -v "^\[ERROR\] *$" | head -15 | tr '\n' ' ' \
            | sed 's/^/::error title=maven::/'; echo
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            portsync-core/target/portsync-core.jar
            simulator/target/simulator.jar
            loadtest/target/loadtest.jar

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: frontend/dist

  e2e:
    name: End-to-end smoke test (Docker Compose)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Smoke test the full stack
        run: scripts/smoke-test.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: docker compose down -v
