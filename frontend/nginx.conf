# Serves the built dashboard and forwards /api to portsync-core on the same origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Live stream: Server-Sent Events must not be buffered or cut off by idle timeouts.
    location = /api/stream {
        proxy_pass http://portsync-core:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://portsync-core:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Single-page app: unknown paths fall back to index.html so deep links work.
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
